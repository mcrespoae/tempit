name: Publish Python distributions to PyPI

on:
  push:
    tags:
      - '*'

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: flake8 Lint
      run: uvx flake8

    - name: Run unittests
      run: uv run python -m unittest discover -v -s ./tests -p "*test*.py"


  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Fetch all history for all tags and branches
      run: git fetch --prune --unshallow

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0

    - name: Build a binary wheel
      run: uv build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/


  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
        id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1


  github-release:
    name: Sign the Python distribution with Sigstore and upload them to GitHub Release

    needs: publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
        contents: write  # IMPORTANT: mandatory for making GitHub Releases
        id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: |
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v ver="$version" '
          $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
          capture && (/^## / || /^\[[^]]+\]:/) { exit }
          capture { print }
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "No CHANGELOG section found for ${version}; publishing with empty notes." >&2
        fi

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --notes-file release_notes.md

    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
      run: |
        gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'



