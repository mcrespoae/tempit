# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python push to main - Run test and lint

on:
  push:
    branches: [ "main" ]
    paths:
      - "tempit/**.py"
      - "tests/**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/push_to_main.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tempit/**.py"
      - "tests/**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/push_to_main.yml"

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v10
          with:
            enable-cache: true
            python-version: "3.14"

        - name: Install dependencies
          run: uv sync --frozen --group dev

        - name: flake8 Lint
          run: uvx flake8 --ignore "F401,E402,E302,E305,E265,E701,F824" --exclude ".venv,.git,__pycache__,build,dist,examples/examples.py" --max-line-length 350


        - name: Run unittests
          run: uv run python -m unittest discover -v -s ./tests -p "*test*.py"