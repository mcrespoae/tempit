# This workflow installs Python dependencies, runs lint and the test suite.
# Lint runs once; tests run across every supported OS/Python combination.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python push to main - Run lint and tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "tempit/**.py"
      - "tests/**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".flake8"
      - ".github/workflows/**"
      - "CHANGELOG.md"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tempit/**.py"
      - "tests/**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".flake8"
      - ".github/workflows/**"
      - "CHANGELOG.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: flake8 Lint
        run: uvx flake8

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unittests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.14'
        run: uv run python -m unittest discover -v -s ./tests -p "*test*.py"

      # Coverage is measured once (the fastest, most stable cell) to keep the
      # matrix cheap; the other cells only assert correctness.
      - name: Run unittests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv run coverage run --source=tempit -m unittest discover -s ./tests -p "*test*.py"
          uv run coverage report -m

      - name: Build coverage HTML report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run coverage html

      - name: Store coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
