  <text x="253" y="192" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">A dead simple time decorator for Python.</text>
  <text x="253" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#7EE787">@tempit &#8594; &lt;function&gt; took 0.35&#181;s</text>
